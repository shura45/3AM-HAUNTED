<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0", viewport-fit=cover>
    <title>3am Haunted party house</title>
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Lora:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
    --night: #0a0610;
    --plum: #1d0f2e;
  --blood: #b3121f;
    --pumpkin: #ff7a1a;
    --bone: white;
    --slime: green;
     --mist: #b9aad8;

}

* { box-sizing: border-box; margin: 0; }
html { scroll-behavior: smooth; background: var(--night); }
body {
  font-family: 'Lora', Georgia, serif;
  background: var(--night);
  color: var(--bone);
  line-height: 1.7;
  font-size: 1.05rem;
  overflow-x: hidden;  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
    
h1,h2 {font-family: 'Creepster',cursive;
font-weight: 400;
 letter-spacing: 2px;}
 section{ padding: 72px 20px; max-width: 800px; margin: 0 auto; text-align: center;}
 h2{font-size: 2.6rem; color: var(--blood); margin-bottom: 20px; text-shadow: 0 0 12px rgba(179,18,31,.6); }

body::after {
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 50;
  background: radial-gradient(circle 220px at var(--mx, 50%) var(--my, 40%), transparent 0%, rgba(0,0,0,.55) 60%, rgba(0,0,0,.85) 100%);
}

 .hero{
    min-height: 100vh;
    display: flex;
     text-align: center; padding: 20px; position: relative; overflow: hidden;
    flex-direction: column; align-items: center; justify-content: center; background: radial-gradient(circle at 50% 35%, var(--plum), var(--night) 70%);
    text-align: center; padding: 20px; position: relative;overflow: hidden;
 }
 .hero h1{font-size: clamp(3rem, 10vw, 6rem); color: var(--pumpkin); text-shadow: 0 0 25px rgba((179,18,31,.8); animation: flicker 5s infinite; position: relative; z-index: 2;}
  .hero p { max-width: 460px; margin: 10px 0 24px; position: relative; z-index: 2; }
    .time-tag { color: var(--mist); font-size: .95rem; letter-spacing: 3px; margin-bottom: 8px; position: relative; z-index: 2; }
@keyframes flicker {
  0%, 18%, 22%, 62%, 64%, 100% { opacity: 1; }
  20%, 63% { opacity: .15; }
  21% { opacity: .8; }
}
.ghost{
    position: absolute;font-size: 2.4rem; opacity: .7; animation: float 6s ease-in-out infinite ; filter: blur(.5px);
}
.g1{
    top: 14%; left: 10%;
}
.g2{
    top: 24%; right: 12%; animation-delay: 2s;

}
.g3{
    bottom: 14%; left: 18%; animation-delay: 4s;
}

.fog {
  position: absolute; inset: auto 0 0 0; height: 45%; pointer-events: none; z-index: 1;
  background: linear-gradient(to top, rgba(185,170,216,.22), transparent);
  animation: drift 12s ease-in-out infinite alternate;
}
@keyframes drift { from { transform: translateX(-3%); opacity: .6; } to { transform: translateX(3%); opacity: 1; } }

.eyes { position: absolute; display: flex; gap: 10px; opacity: 0; animation: blink 9s infinite; z-index: 1; }
.eyes i { width: 12px; height: 7px; border-radius: 50%; background: var(--blood); box-shadow: 0 0 10px 3px var(--blood); }
.e1 { top: 62%; left: 6%; }
.e2 { top: 38%; right: 5%; animation-delay: 3s; }
.e3 { top: 78%; right: 22%; animation-delay: 6s; }
@keyframes blink { 0%, 40% { opacity: 0; } 45%, 70% { opacity: 1; } 73% { opacity: 0; } 76% { opacity: 1; } 80%, 100% { opacity: 0; } }

.pumpkin {
  position: relative; width: 110px; height: 96px; margin-bottom: 18px; cursor: pointer; z-index: 2;
  background: radial-gradient(circle at 40% 35%, #ffa14a, var(--pumpkin) 60%, #b84d00);
  border-radius: 50% 50% 46% 46%; box-shadow: 0 0 40px rgba(255,122,26,.55);
  animation: glow 2.4s ease-in-out infinite alternate;
}
.pumpkin::before { content: ""; position: absolute; top: -14px; left: 50%; width: 14px; height: 20px; margin-left: -7px; background: #3b5a1a; border-radius: 4px 4px 0 0; }
.eye { position: absolute; top: 30px; width: 20px; height: 20px; background: #1a0a00; clip-path: polygon(50% 0, 100% 100%, 0 100%); }
.eye.l { left: 24px; }
.eye.r { right: 24px; }
.mouth { position: absolute; left: 22px; right: 22px; bottom: 14px; height: 22px; background: #1a0a00; clip-path: polygon(0 20%, 12% 100%, 25% 30%, 38% 100%, 50% 30%, 62% 100%, 75% 30%, 88% 100%, 100% 20%, 100% 0, 0 0); }
@keyframes glow { from { box-shadow: 0 0 25px rgba(255,122,26,.35); } to { box-shadow: 0 0 60px rgba(255,122,26,.8); } }
.hint { font-size: .8rem; color: var(--mist); margin-bottom: 14px; position: relative; z-index: 2; }

    button {
    font: inherit; font-weight: 600; font-size: 1.05rem; cursor: pointer;
    background: var(--pumpkin); color: var(--night); border: 0;
    padding: 12px 28px; border-radius: 999px; transition: transform .15s, background .15s;
  }
  button:hover { transform: scale(1.06); background: var(--slime); }
  button:focus-visible , .pumpkin:focus-visible{ outline: 3px solid var(--bone); outline-offset: 3px; }
@keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-8px); } 40% { transform: translateX(8px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(5px); } }

    footer { text-align: center; padding: 30px; color: #a99bc7; font-size: .9rem; }

#scare {
  position: fixed; inset: 0; z-index: 100; display: none; align-items: center; justify-content: center;
  background: #000; font-size: min(60vw, 60vh); cursor: pointer;
}
#scare.on { display: flex; animation: scareflash .15s steps(2) 6; }
#scare span { filter: drop-shadow(0 0 40px var(--blood)); }
@keyframes scareflash { 0% { background: #000; } 50% { background: var(--blood); } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; }
  .eyes { opacity: .8; }
</style>

</head>
<body>
    <header class="hero">
        <span class="ghost g1">👻</span><span class="ghost g2"🦇></span><span class="ghost g3">👻</span>
        <div class="pumpkin" id="pumpkin" title="CLICK ME!" role="img" aria-label="Glowing jack-o'-1antern">
        <div class="eye 1"></div><div class="eye r"></div><div class="mouth"></div>
        </div>
        <h1>HAUNTED HOUSE PARTY</h1>
        <P>Costumes, Candy and few friendly screams. Come if you dare.</P>
        <a href="#details"><button>see the details</button></a>
    </header>

    <section>
        <h2>
            Time until halloween
        </h2>
        <div class="countdown">
            <div class="box"><strong id="d">0</strong>days</div>
            <div class="box"><strong id="h">0</strong>hours</div>
            <div class="box"><strong id="m">0</strong>minutes</div>
            <div class="box"><strong id="s">0</strong>seconds</div>
        </div>
    </section>
    <section>
        <h2>Trick or treat</h2>
        <button id="treatBtn">Knock on the door</button>
        <p id="result" aria-live="polite"></p>
    </section>
    <footer>MADE WITH 🎃 annnnd a little of fun </footer>
    <script>
        

        document.getElementById('treatBtn').addEventListener('click', () => {
    const pick = outcomes[Math.floor(Math.random() * outcomes.length)];
    document.getElementById('result').textContent = pick;
  });
     function updateCountdown() {
    const now = new Date();
    let target = new Date(now.getFullYear(), 9, 31, 19, 0, 0); // month 9 = October
    if (target < now) target = new Date(now.getFullYear() + 1, 9, 31, 19, 0, 0);
    const diff = target - now;
    document.getElementById('d').textContent = Math.floor(diff / 86400000);
    document.getElementById('h').textContent = Math.floor(diff / 3600000) % 24;
    document.getElementById('m').textContent = Math.floor(diff / 60000) % 60;
    document.getElementById('s').textContent = Math.floor(diff / 1000) % 60;
  }
    updateCountdown();
  setInterval(updateCountdown, 1000);
    </script>
</body>
</html>
